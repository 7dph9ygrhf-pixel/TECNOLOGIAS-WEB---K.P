  <meta charset="UTF-8">

</head>
<body>

  <!-- Encabezado -->
  <header>
    <p class="logo">Tecnologías Web</p>

    <!-- Menú de navegación -->
    <nav>
      <ul>
        <li><a href="../index.html">Inicio</a></li>
        <li><a href="tecnologias.html">Tecnologías Web</a></li>
        <li><a href="sociedad.html">Sociedad</a></li>

        <li><a class="activo" href="contacto.html">Contacto</a></li>
      </ul>
    </nav>
  </header>

  <!-- Contenido principal -->
  <main>
    <h1>Contacto</h1>
    <section>
      <h2>Formulario de contacto</h2>
      <p>¿Comentarios o dudas sobre el sitio? Escríbeme con este formulario; todos los campos son obligatorios.</p>

      <form>
        <p>
          <label for="nombre">Nombre:</label>
          <input type="text" id="nombre" name="nombre" required>
        </p>
        <p>
          <label for="correo">Correo electrónico:</label>
          <input type="email" id="correo" name="correo" required>
        </p>
        <p>
          <label for="asunto">Asunto:</label>
          <input type="text" id="asunto" name="asunto" required>
        </p>
        <p>
          <label for="mensaje">Mensaje:</label>
          <textarea id="mensaje" name="mensaje" required></textarea>
        </p>
        <button type="submit">Enviar</button>
      </form>
    </section>
  </main>

  <!-- Pie de página -->
  <footer>
    <p>&copy;  K.Parra - Tecnologías Web</p>
  </footer>

</body>
